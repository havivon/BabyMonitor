name: Android APK

# Builds the Capacitor Android app (web build bundled in the APK) and publishes the APK
# as a workflow artifact and as a GitHub pre-release asset that can be downloaded on a phone.
on:
  push:
    branches: [main, ccr-c3f89a1f-qrcn5w]
    paths-ignore: ['docs/**', '**/*.md']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Firestore security rules + two-device sync, against the Firebase emulators (no real project).
  firebase-rules:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        run: npm ci

      - name: Rules + integration tests (emulators)
        run: npm run test:rules

  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      # Optional Firebase (accounts & family sync — docs/ACCOUNTS.md). Without these the APK is
      # local-only and all account UI stays hidden.
      - name: Restore google-services.json
        env:
          # Either secret works: the file's text pasted as-is, or its base64 encoding.
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
          elif [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d > android/app/google-services.json
          else
            echo "::notice::GOOGLE_SERVICES_JSON is not set; native Google sign-in is unavailable."
          fi
          if [ -f android/app/google-services.json ]; then
            node -e "JSON.parse(require('fs').readFileSync('android/app/google-services.json','utf8'))" \
              || { echo "::error::google-services.json is not valid JSON — re-paste the whole file into the secret."; exit 1; }
          fi

      - name: Build web assets and sync Android project
        env:
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
        run: npm run build:android

      # Optional stable signing key from repository secrets (see README → אנדרואיד).
      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 is not set; signing with a throwaway debug key."
          fi

      # ubuntu-latest ships the Android SDK (ANDROID_HOME); Gradle fetches any missing platform.
      - name: Build debug APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: ./gradlew --no-daemon assembleDebug

      - name: Rename APK
        run: |
          VERSION=$(node -p "require('./package.json').version")
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk "out/BabyMonitor-${VERSION}-build${{ github.run_number }}.apk"
          ls -l out

      - uses: actions/upload-artifact@v4
        with:
          name: BabyMonitor-apk
          path: out/*.apk
          if-no-files-found: error

      - name: Publish pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-build-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: BabyMonitor Android (build ${{ github.run_number }})
          prerelease: true
          files: out/*.apk
          body: |
            קובץ APK להתקנה ישירה על אנדרואיד (גרסת debug חתומה).
            בטלפון: להוריד את הקובץ, לפתוח אותו ולאשר "התקנה ממקורות לא ידועים".
