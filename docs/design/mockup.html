<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>BabyMonitor · Mockups</title>
<!--
  Static design mockup. Each phone is an <iframe srcdoc> so that media queries,
  dvh and position:fixed behave exactly like a 390×844 phone viewport.
  The iframes load the production CSS from ../../src/styles/ (relative to this file).
  Rubik is loaded from Google Fonts here only; the app self-hosts it via @fontsource.
-->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../../src/styles/tokens.css" />
<style>
  body { margin: 0; font-family: "Rubik", system-ui, sans-serif; background: #e9e4db; color: #1f2b29; }
  .board { padding: 56px 64px 72px; }
  .board--dark { background: #0b0a09; color: #eae3d8; }
  .board__head { display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; margin-block-end: 40px; }
  .board__title { font-size: 34px; font-weight: 600; margin: 0; letter-spacing: -0.01em; }
  .board__sub { margin: 6px 0 0; font-size: 16px; opacity: 0.7; }
  .swatches { display: flex; gap: 10px; direction: ltr; }
  .sw { display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 11px; opacity: 0.9; }
  .sw i { inline-size: 36px; block-size: 36px; border-radius: 10px; box-shadow: inset 0 0 0 1px rgb(0 0 0 / 0.08); }
  .grid { display: grid; grid-template-columns: repeat(3, 410px); gap: 56px 48px; justify-content: center; }
  figure { margin: 0; display: flex; flex-direction: column; align-items: center; gap: 16px; }
  .phone { inline-size: 410px; block-size: 864px; padding: 10px; border-radius: 56px; background: #1c1b1a;
    box-shadow: 0 0 0 1px rgb(0 0 0 / 0.25), 0 30px 60px -20px rgb(40 30 20 / 0.35), 0 12px 24px -12px rgb(40 30 20 / 0.25); }
  .board--dark .phone { background: #2a2826; box-shadow: 0 0 0 1px rgb(255 255 255 / 0.06), 0 30px 60px -20px rgb(0 0 0 / 0.8); }
  .phone__screen { inline-size: 390px; block-size: 844px; border-radius: 46px; overflow: hidden; background: #fff; }
  .phone iframe { display: block; inline-size: 390px; block-size: 844px; border: 0; }
  figcaption { font-size: 15px; font-weight: 500; opacity: 0.75; }
</style>
</head>
<body>
<section class="board" id="board-light" data-theme="light">
  <div class="board__head">
    <div>
      <h1 class="board__title">BabyMonitor · מסכי מפתח</h1>
      <p class="board__sub">ערכת נושא בהירה · 390×844 · RTL</p>
    </div>
    <div class="swatches">
      <span class="sw"><i style="background:var(--color-primary)"></i>primary</span>
      <span class="sw"><i style="background:var(--color-accent)"></i>accent</span>
      <span class="sw"><i style="background:var(--color-breast)"></i>breast</span>
      <span class="sw"><i style="background:var(--color-bottle)"></i>bottle</span>
      <span class="sw"><i style="background:var(--color-solid)"></i>solid</span>
      <span class="sw"><i style="background:var(--color-growth)"></i>growth</span>
      <span class="sw"><i style="background:var(--color-bg)"></i>bg</span>
    </div>
  </div>
  <div class="grid" id="grid-light"></div>
</section>
<section class="board board--dark" id="board-dark" data-theme="dark">
  <div class="board__head">
    <div>
      <h1 class="board__title">BabyMonitor · מצב לילה</h1>
      <p class="board__sub">ערכת נושא כהה · משטחים חמים, בלי לבן טהור</p>
    </div>
    <div class="swatches">
      <span class="sw"><i style="background:var(--color-primary)"></i>primary</span>
      <span class="sw"><i style="background:var(--color-accent)"></i>accent</span>
      <span class="sw"><i style="background:var(--color-breast)"></i>breast</span>
      <span class="sw"><i style="background:var(--color-bottle)"></i>bottle</span>
      <span class="sw"><i style="background:var(--color-solid)"></i>solid</span>
      <span class="sw"><i style="background:var(--color-growth)"></i>growth</span>
      <span class="sw"><i style="background:var(--color-surface)"></i>surface</span>
    </div>
  </div>
  <div class="grid" id="grid-dark"></div>
</section>

<!-- ============ ONBOARDING ============ -->
<template id="s-onboarding" data-label="קליטה ראשונה · Onboarding">
<main class="onboarding">
  <div class="onboarding__intro">
    <div class="brand-mark" aria-hidden="true"><svg class="lucide lucide-droplet" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 22a7 7 0 0 0 7-7c0-2-1-3.9-3-5.5s-3.5-4-4-6.5c-.5 2.5-2 4.9-4 6.5C6 11.1 5 13 5 15a7 7 0 0 0 7 7z" /></svg></div>
    <h1 class="onboarding__title">ברוכים הבאים ל-BabyMonitor</h1>
    <p class="onboarding__lead">מעקב רגוע ופשוט אחר האכלות וגדילה. כמה פרטים קטנים ומתחילים.</p>
  </div>
  <form class="onboarding__form">
    <div class="field">
      <label class="field__label" for="n">שם</label>
      <input class="input" id="n" value="נועה" />
    </div>
    <div class="field">
      <span class="field__label">תאריך לידה</span>
      <label class="input input--picker"><svg class="lucide lucide-calendar" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 2v3" /><path d="M16 2v3" /><rect x="3" y="3" width="18" height="18" rx="2" /><path d="M3 9h18" /></svg><span class="input__value">1 ביולי 2026</span></label>
    </div>
    <div class="field">
      <span class="field__label">מין</span>
      <div class="seg seg--lg" role="radiogroup">
        <button type="button" class="seg__option" role="radio" aria-checked="true">בת</button>
        <button type="button" class="seg__option" role="radio" aria-checked="false">בן</button>
      </div>
      <span class="field__hint">משמש לחישוב אחוזוני הגדילה לפי טבלאות WHO</span>
    </div>
    <div class="field">
      <label class="field__label" for="w">משקל לידה <span class="field__optional">(לא חובה)</span></label>
      <div class="input-group">
        <input class="input input--num" id="w" value="3.30" inputmode="decimal" />
        <span class="input-group__affix">ק״ג</span>
      </div>
      <span class="field__hint">מומלץ — כך אפשר לעקוב אחרי החזרה למשקל הלידה</span>
    </div>
  </form>
  <div class="onboarding__footer">
    <button class="btn btn--primary btn--lg btn--block">התחלה</button>
    <p class="disclaimer" style="justify-content:center"><svg class="lucide lucide-shield-check" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z" /><path d="m9 12 2 2 4-4" /></svg><span>בלי הרשמה ובלי שרת — הכול נשמר במכשיר שלך</span></p>
  </div>
</main>
</template>

<!-- ============ HOME ============ -->
<template id="s-home" data-label="בית · עם טיימר פעיל" data-scroll="0">
<div class="app app--has-timer">
  <header class="app-header">
    <button class="baby-switch" aria-label="החלפת ילד/ה">
      <span class="avatar">נ</span>
      <span class="baby-switch__text"><span class="baby-switch__name">נועה</span><span class="baby-switch__age">3 חודשים ו-4 ימים</span></span>
      <svg class="lucide lucide-chevron-down" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6" /></svg>
    </button>
  </header>
  <main class="page">
    <section class="card since" aria-labelledby="since-l">
      <div class="since__top">
        <span class="since__label" id="since-l">מאז ההאכלה האחרונה</span>
        <span class="badge badge--accent badge--lg"><svg class="lucide lucide-arrow-left-right" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 3 4 7l4 4" /><path d="M4 7h16" /><path d="m16 21 4-4-4-4" /><path d="M20 17H4" /></svg>הצד הבא: שמאל</span>
      </div>
      <div class="since__value">
        <span class="since__part"><span>2</span><span class="since__unit">שע׳</span></span>
        <span class="since__part"><span>40</span><span class="since__unit">ד׳</span></span>
      </div>
      <div class="since__meta">
        <span class="badge badge--bottle"><svg class="lucide lucide-milk" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 2h8" /><path d="M9 2v2.789a4 4 0 0 1-.672 2.219l-.656.984A4 4 0 0 0 7 10.212V20a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2v-9.789a4 4 0 0 0-.672-2.219l-.656-.984A4 4 0 0 1 15 4.788V2" /><path d="M7 15a6.472 6.472 0 0 1 5 0 6.47 6.47 0 0 0 5 0" /></svg>בקבוק</span>
        <span><span class="ltr num">120</span> מ״ל תמ״ל · <span class="ltr num">11:20</span></span>
      </div>
    </section>

    <section class="section" aria-labelledby="add-h">
      <h2 class="visually-hidden" id="add-h">הוספת האכלה</h2>
      <div class="tile-grid">
        <button class="tile tile--breast tile--active" aria-label="הנקה פעילה, פתיחת הטיימר">
          <span class="tile__icon"><svg class="lucide lucide-heart" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 9.5a5.5 5.5 0 0 1 9.591-3.676.56.56 0 0 0 .818 0A5.49 5.49 0 0 1 22 9.5c0 2.29-1.5 4-3 5.5l-5.492 5.313a2 2 0 0 1-3 .019L5 15c-1.5-1.5-3-3.2-3-5.5" /></svg></span>
          <span class="tile__label">הנקה</span>
          <span class="tile__meta">פעילה · <span class="ltr num">12:34</span></span>
        </button>
        <button class="tile tile--bottle" aria-label="הוספת בקבוק">
          <span class="tile__icon"><svg class="lucide lucide-milk" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 2h8" /><path d="M9 2v2.789a4 4 0 0 1-.672 2.219l-.656.984A4 4 0 0 0 7 10.212V20a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2v-9.789a4 4 0 0 0-.672-2.219l-.656-.984A4 4 0 0 1 15 4.788V2" /><path d="M7 15a6.472 6.472 0 0 1 5 0 6.47 6.47 0 0 0 5 0" /></svg></span>
          <span class="tile__label">בקבוק</span>
          <span class="tile__meta">אחרון: <span class="ltr num">120</span> מ״ל</span>
        </button>
        <button class="tile tile--solid" aria-label="הוספת מוצקים">
          <span class="tile__icon"><svg class="lucide lucide-apple" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 6.528V3a1 1 0 0 1 1-1h0" /><path d="M18.237 21A15 15 0 0 0 22 11a6 6 0 0 0-10-4.472A6 6 0 0 0 2 11a15.1 15.1 0 0 0 3.763 10 3 3 0 0 0 3.648.648 5.5 5.5 0 0 1 5.178 0A3 3 0 0 0 18.237 21" /></svg></span>
          <span class="tile__label">מוצקים</span>
          <span class="tile__meta">אחרון: אתמול</span>
        </button>
      </div>
    </section>

    <section class="section">
      <div class="section__header">
        <h2 class="section__title">היום</h2>
        <a class="section__action" href="#">לסטטיסטיקה<svg class="lucide lucide-chevron-left" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6" /></svg></a>
      </div>
      <div class="stat-grid">
        <div class="stat stat--primary"><span class="stat__label"><svg class="lucide lucide-clock" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10" /><path d="M12 6v6l4 2" /></svg>האכלות</span><span class="stat__value">5</span><span class="stat__sub">אתמול: 7</span></div>
        <div class="stat stat--bottle"><span class="stat__label"><svg class="lucide lucide-milk" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 2h8" /><path d="M9 2v2.789a4 4 0 0 1-.672 2.219l-.656.984A4 4 0 0 0 7 10.212V20a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2v-9.789a4 4 0 0 0-.672-2.219l-.656-.984A4 4 0 0 1 15 4.788V2" /><path d="M7 15a6.472 6.472 0 0 1 5 0 6.47 6.47 0 0 0 5 0" /></svg>בקבוק</span><span class="stat__value">360<span class="stat__unit">מ״ל</span></span><span class="stat__sub">3 בקבוקים</span></div>
        <div class="stat stat--breast"><span class="stat__label"><svg class="lucide lucide-heart" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 9.5a5.5 5.5 0 0 1 9.591-3.676.56.56 0 0 0 .818 0A5.49 5.49 0 0 1 22 9.5c0 2.29-1.5 4-3 5.5l-5.492 5.313a2 2 0 0 1-3 .019L5 15c-1.5-1.5-3-3.2-3-5.5" /></svg>הנקה</span><span class="stat__value">42<span class="stat__unit">ד׳</span></span><span class="stat__sub">2 הנקות</span></div>
        <div class="stat"><span class="stat__label"><svg class="lucide lucide-repeat-2" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m2 9 3-3 3 3" /><path d="M13 18H7a2 2 0 0 1-2-2V6" /><path d="m22 15-3 3-3-3" /><path d="M11 6h6a2 2 0 0 1 2 2v10" /></svg>מרווח ממוצע</span><span class="stat__value"><span class="ltr">2:35</span><span class="stat__unit">שע׳</span></span><span class="stat__sub">בין האכלות</span></div>
      </div>
    </section>

    <section class="section">
      <div class="section__header">
        <h2 class="section__title">אחרונות</h2>
        <a class="section__action" href="#">לכל ההיסטוריה<svg class="lucide lucide-chevron-left" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6" /></svg></a>
      </div>
      <ol class="timeline__list" role="list">
        <li><button class="timeline-item timeline-item--bottle"><span class="timeline-item__time">11:20</span><span class="timeline-item__icon"><svg class="lucide lucide-milk" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 2h8" /><path d="M9 2v2.789a4 4 0 0 1-.672 2.219l-.656.984A4 4 0 0 0 7 10.212V20a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2v-9.789a4 4 0 0 0-.672-2.219l-.656-.984A4 4 0 0 1 15 4.788V2" /><path d="M7 15a6.472 6.472 0 0 1 5 0 6.47 6.47 0 0 0 5 0" /></svg></span><span class="timeline-item__body"><span class="timeline-item__title">בקבוק</span><span class="timeline-item__meta">תמ״ל</span></span><span class="timeline-item__value"><span class="num">120</span> מ״ל</span></button></li>
        <li><button class="timeline-item timeline-item--breast"><span class="timeline-item__time">09:05</span><span class="timeline-item__icon"><svg class="lucide lucide-heart" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 9.5a5.5 5.5 0 0 1 9.591-3.676.56.56 0 0 0 .818 0A5.49 5.49 0 0 1 22 9.5c0 2.29-1.5 4-3 5.5l-5.492 5.313a2 2 0 0 1-3 .019L5 15c-1.5-1.5-3-3.2-3-5.5" /></svg></span><span class="timeline-item__body"><span class="timeline-item__title">הנקה</span><span class="timeline-item__meta">ימין 12 ד׳ · שמאל 9 ד׳</span></span><span class="timeline-item__value">21 ד׳</span></button></li>
      </ol>
    </section>
  </main>

  <div class="timer-banner" role="status">
    <button class="timer-banner__main" aria-label="פתיחת טיימר ההנקה">
      <span class="timer-banner__icon"><svg class="lucide lucide-heart" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 9.5a5.5 5.5 0 0 1 9.591-3.676.56.56 0 0 0 .818 0A5.49 5.49 0 0 1 22 9.5c0 2.29-1.5 4-3 5.5l-5.492 5.313a2 2 0 0 1-3 .019L5 15c-1.5-1.5-3-3.2-3-5.5" /></svg></span>
      <span class="timer-banner__text"><span class="timer-banner__title">הנקה · ימין</span><span class="timer-banner__meta">התחילה ב-<span class="ltr num">14:02</span></span></span>
      <span class="timer-banner__time">12:34</span>
    </button>
    <button class="icon-btn" aria-label="השהיית ההנקה"><svg class="lucide lucide-pause" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="14" y="3" width="5" height="18" rx="1" /><rect x="5" y="3" width="5" height="18" rx="1" /></svg></button>

<script>
  const order = ["s-onboarding", "s-home-empty", "s-home", "s-timer-start", "s-timer", "s-bottle", "s-solids", "s-history", "s-growth", "s-stats", "s-settings", "s-dialog"];
  const head = (theme) => `<!doctype html><html lang="he" dir="rtl" data-theme="${theme}"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../src/styles/tokens.css">
<link rel="stylesheet" href="../../src/styles/global.css">
<link rel="stylesheet" href="../../src/styles/components.css">
<style>
  :root { --safe-top: 44px; --safe-bottom: 22px; }
  body { overflow: hidden; }
  *, *::before, *::after { animation-play-state: paused !important; animation-delay: -10s !important; }
  .mock-status { position: fixed; inset-block-start: 0; inset-inline: 0; z-index: 100; block-size: 44px; direction: ltr;
    display: flex; align-items: center; justify-content: space-between; padding: 4px 30px 0; font: 600 15px/1 var(--font-sans); color: var(--color-text); pointer-events: none; }
  .mock-status b { display: inline-flex; gap: 5px; align-items: center; }
  .mock-status i { display: inline-block; inline-size: 24px; block-size: 11px; border-radius: 3px; border: 1.5px solid currentColor; opacity: .85; position: relative; }
  .mock-status i::after { content: ""; position: absolute; inset: 1.5px 5px 1.5px 1.5px; background: currentColor; border-radius: 1px; }
  .mock-home { position: fixed; inset-block-end: 8px; left: 50%; z-index: 100; inline-size: 134px; block-size: 5px; margin-left: -67px; border-radius: 3px; background: var(--color-text); opacity: .8; }
</style></head><body>`;
  for (const theme of ["light", "dark"]) {
    const grid = document.getElementById("grid-" + theme);
    for (const id of order) {
      const t = document.getElementById(id);
      const fig = document.createElement("figure");
      const phone = document.createElement("div");
      phone.className = "phone";
      const screen = document.createElement("div");
      screen.className = "phone__screen";
      const frame = document.createElement("iframe");
      frame.title = t.dataset.label;
      frame.loading = "eager";
      frame.srcdoc = head(theme) + '<div class="mock-status"><span>9:41</span><b><span>5G</span><i></i></b></div>' + t.innerHTML + '<div class="mock-home"></div></body></html>';
      screen.append(frame);
      phone.append(screen);
      const cap = document.createElement("figcaption");
      cap.textContent = t.dataset.label;
      fig.append(phone, cap);
      grid.append(fig);
    }
  }
</script>
</body>
</html>
